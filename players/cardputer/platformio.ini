; Firmware Herodio pour M5Stack Cardputer / Cardputer ADV (ESP32-S3).
; Compilation : pio run    — Flash : pio run -t upload
[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Cardputer
  bblanchon/ArduinoJson@^7
