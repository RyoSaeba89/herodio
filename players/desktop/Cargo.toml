[package]
name = "herodio-player"
version = "0.3.1"
edition = "2021"
description = "Lecteur d'histoires audio interactives Herodio (Windows, Linux, Raspberry Pi)"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
opt-level = "s"

[build-dependencies]
embed-resource = "3.0.12"
